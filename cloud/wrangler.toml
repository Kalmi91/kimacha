name = "kimacha"
main = "worker.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "USERS"
class_name = "KimachaUsers"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KimachaUsers"]
