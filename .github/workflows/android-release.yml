name: Android Release

# Signed Android build + release. The keystore and passwords come from repository
# secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD): generate the keystore once and store it base64-encoded.
# Runs on demand; on a v* tag it would also publish a GitHub Release with the
# signed APK + AAB attached and auto-generated notes.
# The tag trigger is switched off (maintainer, 2026-09-09). Two things stop this
# workflow from running at all, and until both are fixed a v* tag push would only
# add a red check next to the green CI:
#   1. `android/` is not in the repository (generated native folders are in
#      `.gitignore`), so the `setup-java` Gradle cache step finds no Gradle files
#      when it runs and fails there. The native side of a release is hand-maintained,
#      not generated: `expo prebuild` would overwrite the signing keystore, so
#      releases are built locally.
#   2. The four signing secrets (ANDROID_KEYSTORE_*) are not uploaded to the
#      repository.
# Until then, releases are built locally (see the README, "Release process").
# To switch the tag trigger back on, restore the `push: tags: - 'v*'` block.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-build:
    name: Build signed release (AAB + APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create a GitHub Release on v* tags
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2

      - name: Install dependencies
        run: npm ci

      # android/ is gitignored (managed Expo workflow); regenerate it.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is not set. Add it (plus ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Build unsigned release artifacts, then sign them ourselves — this is
      # independent of what signingConfig the regenerated build.gradle uses.
      - name: Build release artifacts
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Sign APK (zipalign + apksigner)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK_IN="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK_IN" "$RUNNER_TEMP/kimacha-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --out "$RUNNER_TEMP/kimacha-release.apk" \
            "$RUNNER_TEMP/kimacha-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/kimacha-release.apk"

      - name: Sign AAB (jarsigner)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB_IN="$(ls android/app/build/outputs/bundle/release/*.aab | head -1)"
          cp "$AAB_IN" "$RUNNER_TEMP/kimacha-release.aab"
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -keypass "${ANDROID_KEY_PASSWORD}" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$RUNNER_TEMP/kimacha-release.aab" "${ANDROID_KEY_ALIAS}"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kimacha-release-signed
          path: |
            ${{ runner.temp }}/kimacha-release.apk
            ${{ runner.temp }}/kimacha-release.aab
          if-no-files-found: error

      # On a v* tag, publish a GitHub Release with the signed artifacts attached.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            ${{ runner.temp }}/kimacha-release.apk
            ${{ runner.temp }}/kimacha-release.aab
          generate_release_notes: true
          fail_on_unmatched_files: true
