name: Android Release

# Signed Android build + release. The keystore + passwords come from repo Secrets
# (the user generates the keystore once — see docs/DEVOPS.md "Runtime / user
# inputs"). Runs on demand, or on a v* tag — on a tag it also publishes a GitHub
# Release with the signed APK + AAB attached and auto-generated notes.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-build:
    name: Build signed release (AAB + APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create a GitHub Release on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # android/ is gitignored (managed Expo workflow); regenerate it.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is not set. Add it (plus ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Build unsigned release artifacts, then sign them ourselves — this is
      # independent of what signingConfig the regenerated build.gradle uses.
      - name: Build release artifacts
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Sign APK (zipalign + apksigner)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK_IN="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK_IN" "$RUNNER_TEMP/kimacha-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --out "$RUNNER_TEMP/kimacha-release.apk" \
            "$RUNNER_TEMP/kimacha-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/kimacha-release.apk"

      - name: Sign AAB (jarsigner)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB_IN="$(ls android/app/build/outputs/bundle/release/*.aab | head -1)"
          cp "$AAB_IN" "$RUNNER_TEMP/kimacha-release.aab"
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -keypass "${ANDROID_KEY_PASSWORD}" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$RUNNER_TEMP/kimacha-release.aab" "${ANDROID_KEY_ALIAS}"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kimacha-release-signed
          path: |
            ${{ runner.temp }}/kimacha-release.apk
            ${{ runner.temp }}/kimacha-release.aab
          if-no-files-found: error

      # On a v* tag, publish a GitHub Release with the signed artifacts attached.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/kimacha-release.apk
            ${{ runner.temp }}/kimacha-release.aab
          generate_release_notes: true
          fail_on_unmatched_files: true
