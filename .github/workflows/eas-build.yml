name: EAS Build

# Optional cloud build on Expo's EAS infrastructure. Manual-only — it consumes
# EAS build credits and needs an Expo account token. The local Gradle workflows
# (android.yml / android-release.yml) cover CI at $0; this is here to show the
# EAS path and produce store-ready builds without a local Android toolchain.
#
# Requires the EXPO_TOKEN secret (Expo access token: expo.dev → Account →
# Access tokens). Signing credentials are managed by EAS (remote) — no keystore
# secrets needed here.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options:
          - development
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eas-build:
    name: EAS build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # 8.2.1
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
