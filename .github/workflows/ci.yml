name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, one `npm ci` (the install was done three times before). The cheap
  # steps run first, so a type or lint error fails the run before the tests start.
  ci:
    name: Typecheck, lint, data and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Full-project typecheck (tsc --noEmit). The exam/data refactor has
      # landed, so no files are excluded anymore.
      - name: Typecheck
        run: npm run typecheck:ci

      - name: Lint
        run: npm run lint

      # Word list, en-track, corpus and games audits (scripts/*.mjs).
      - name: Audit data
        run: npm run audit:data

      # Coverage and its threshold (jest.config.js) are measured on main only;
      # a pull request runs the plain suite, which is faster.
      - name: Run tests
        if: github.event_name == 'pull_request'
        run: npx jest --ci --maxWorkers=2

      - name: Run tests with coverage
        if: github.event_name != 'pull_request'
        run: npm run test:ci

      - name: Upload coverage
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
