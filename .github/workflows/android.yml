name: Android APK

# Manual only. Releases are built locally and shipped from a v* tag, so a
# debug APK on every push to main was work nobody collected.
on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # android/ is gitignored (managed Expo workflow); regenerate it.
      # --no-install: deps are already present from `npm ci` above.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimacha-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
