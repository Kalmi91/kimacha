name: Smoke

# Kálmán, 2026-09-09: "nézd meg hogy nem bassza-e szét az egész main-t, de
# nincs kedvem mindegyiket én buildelni". So every pull request answers the
# question the unit tests cannot: does the app still bundle.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: JS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Metro has to resolve every import and every data file for real. A typo
      # in a require path or a broken JSON pack dies here.
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir dist-smoke

